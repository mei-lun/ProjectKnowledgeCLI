name: 项目知识库质量门

on:
  push:
  pull_request:
  schedule:
    - cron: "30 18 * * 0"

jobs:
  quick-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装本地包
        run: python -m pip install -e .
      - name: 运行测试
        run: python -m unittest discover -s tests -v
      - name: 初始化知识库
        run: project-kb init . --quiet
      - name: 运行快速质量门
        run: >-
          project-kb evaluate evaluation/questions.jsonl
          --project .
          --strategy all
          --thresholds evaluation/thresholds.json
--baseline evaluation/baselines/self-repo-0.1.8.json
          --output evaluation/reports/ci-quick.json
          --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-kb-quick-evaluation
          path: evaluation/reports/ci-quick.json

  scheduled-performance:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装本地包
        run: python -m pip install -e .
      - name: 运行 500/5000 文件性能评测
        run: >-
          python evaluation/performance_harness.py
          --sizes 500 5000
          --repetitions 5
          --output evaluation/reports/ci-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-kb-performance
          path: evaluation/reports/ci-performance.json
