version: 1

project:
  name: ProjectKnowledgeCLI

index:
  engine: builtin
  include:
    - **/*
  exclude:
    - .git/**
    - .worktrees/**
    - .project-kb/**
    - .venv/**
    - venv/**
    - __pycache__/**
    - **/__pycache__/**
    - .pytest_cache/**
    - **/.pytest_cache/**
    - node_modules/**
    - dist/**
    - build/**
    - target/**
    - vendor/**
    - docs/knowledge/generated/**
    - docs/knowledge/drafts/**
    - evaluation/reports/**
    - evaluation/baselines/**

knowledge:
  root: docs/knowledge
  generated: docs/knowledge/generated
  drafts: docs/knowledge/drafts
  curated: docs/knowledge/curated
  decisions: docs/knowledge/decisions

updates:
  watch: true
  debounce_ms: 1000
  generated_mode: auto
  curated_mode: proposal
  proposal_trigger: commit

retrieval:
  max_tokens: 6000
  embeddings: disabled

privacy:
  local_only: true
  telemetry: false

provider:
  id: disabled
  model: ""
  endpoint: ""
  enabled: false
  allow_network: false
  authorization: ""
  api_key_env: ""
  timeout_seconds: 30
  max_retries: 2
  cache: true
  checkpoint: true
  max_files: 20
  max_tokens: 12000
  prompt_version: feature-guide-v1
  output_schema_version: semantic-draft-v1
